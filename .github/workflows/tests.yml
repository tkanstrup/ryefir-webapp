name: Signal-facit-test

# Kører ved hvert push og hver pull request. Et rødt resultat betyder at
# signalmotoren afviger fra facit-tilfældene i tests/signal_facit.json.
# Testene bruger ingen netværk (Yahoo mockes).
on:
  push:
  pull_request:

jobs:
  facit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -v
