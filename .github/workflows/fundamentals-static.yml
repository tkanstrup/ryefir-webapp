name: Statisk fundamentals-fil

# Henter navn/sektor/branche/valuta via yfinance fra GitHubs runnere (Yahoo svarer ikke fra Render)
# og committer data/fundamentals_static.json til branchen data/fundamentals-static (IKKE main,
# så Render ikke redeployer). API'et læser filen som sidste fallback.
# Brugerens/testernes tickers: sæt repo-variablen EXTRA_TICKERS (Settings > Secrets and variables
# > Actions > Variables), kommasepareret — står bevidst ikke i koden.
on:
  schedule:
    - cron: "30 4 * * 0"   # søndag 04:30 UTC
  workflow_dispatch:
    inputs:
      extra_tickers:
        description: "Ekstra tickers (kommasepareret) udover EXTRA_TICKERS-variablen"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe .info fra GitHub-runner (kun diagnose, fejler ikke jobbet)
        run: python tools/build_fundamentals_static.py --probe
        continue-on-error: true
      - name: Hent tidligere fil (så en fejlet hentning aldrig sletter gamle værdier)
        run: |
          git fetch --depth 1 origin data/fundamentals-static 2>/dev/null \
            && git show FETCH_HEAD:data/fundamentals_static.json > previous.json \
            || echo '{"tickers": {}}' > previous.json
      - name: Byg og publicér
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }},${{ github.event.inputs.extra_tickers }}
        run: python tools/build_fundamentals_static.py --previous previous.json --out data/fundamentals_static.json --publish
